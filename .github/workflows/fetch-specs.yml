name: Generate Skills from API Specs

on:
  workflow_dispatch:
    inputs:
      openapi_url:
        description: "URL to the OpenAPI spec"
        required: true
        default: "https://dpgr.am/openapi.yml"
      asyncapi_url:
        description: "URL to the AsyncAPI spec"
        required: true
        default: "https://dpgr.am/asyncapi.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install

      - name: Fetch API specs
        run: bun run scripts/fetch-specs.ts "${{ inputs.openapi_url }}" "${{ inputs.asyncapi_url }}"

      - name: Generate skills from specs
        run: bun run scripts/generate-skills.ts

      - name: Upload generated references
        uses: actions/upload-artifact@v4
        with:
          name: generated-references
          path: skills/deepgram-api/references/
